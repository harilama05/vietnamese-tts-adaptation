name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests -v
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n
      - run: bash scripts/train.sh help && bash scripts/evaluate.sh help
      - run: python -m pip install -r requirements/dev.txt -e ./norm
      - run: python -m pytest norm/tests/test_upgrade_0_13_3.py -q
